name: Deploy live demo

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Create missing platform folders
        run: flutter create --project-name movie_library_app --org com.mohamedahmed .
      - uses: actions/upload-artifact@v4
        with:
          name: platform-folders
          path: |
            android
            ios
            web
            windows
            macos
            linux
            .metadata
            pubspec.lock
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings lib test
      - run: flutter test
      - run: flutter build web --release --base-href "/${{ github.event.repository.name }}/"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
